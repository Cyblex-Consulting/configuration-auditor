[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "configuration-auditor"
version = "0.1.4"
description = "Configuration Auditor - audit exported firewall device configs against security benchmarks"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPLv2" }
authors = [ { name = "CYBLEX Consulting" } ]
dependencies = ["fortios_xutils", "bcrypt", "cryptography"]

[project.scripts]
configuration-auditor = "configuration_auditor:main"

[tool.setuptools]
py-modules = ["configuration_auditor"]
include-package-data = true

[tool.setuptools.package-data]
# Ensure Fortigate vendor data (submodule) is included in built distributions
"modules.fortigate.libs.FortigateAppControlID" = ["*", "*/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "modules*", "modules.*"]
